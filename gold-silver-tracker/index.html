
<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Gold Price Today India | 24K, 22K & Silver Rate</title>

    <meta
      name="description"
      content="Check gold price today in India for 24K, 22K and 18K gold, plus today's silver rate per gram. Explore historical gold prices and calculate estimated gold costs."
    />

    <meta
      name="keywords"
      content="gold price today, gold rate today, gold price in India, 24 carat gold rate, 24K gold price today, 22K gold price today, 18K gold rate, silver price today, silver rate per gram, gold price per gram, gold rate calculator"
    />

    <meta name="author" content="Gold & Silver Tracker" />
    <meta name="application-name" content="Gold & Silver Tracker" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#FFFCF5" />

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph: social sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Gold Price Today India | 24K, 22K & Silver Rate"
    />
    <meta
      property="og:description"
      content="Track gold and silver prices per gram in India. Check 24K, 22K and 18K gold rates, view historical trends and calculate estimated costs."
    />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Gold & Silver Tracker" />

    <!-- X / Twitter sharing -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Gold Price Today India | Gold & Silver Tracker"
    />
    <meta
      name="twitter:description"
      content="Check gold and silver rates per gram in India and calculate estimated gold costs."
    />

      Canonical example:
      <link rel="canonical" href="https://YOUR-DOMAIN/" />
    -->

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
